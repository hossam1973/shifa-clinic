<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>عيادة شفاء</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Readex+Pro:wght@500;600;700&display=swap">
<style>
/* Layout: app shell — side rail on desktop, bottom tab bar on phones; RTL throughout */
:root{
  --bg:#f3f6f5; --surface:#ffffff; --sunk:#e8eeec; --line:#d5dfdc;
  --fg:#14211f; --muted:#5b6e6a;
  --accent:#0d6e5f; --accent-ink:#ffffff; --accent-soft:#d9efe9;
  --ok:#1f8a4c; --warn:#b7791f; --bad:#c2413b; --info:#2f6fb3;
  --ok-soft:#ddf2e5; --warn-soft:#fbefd7; --bad-soft:#fbe1df; --info-soft:#deebf8;
  --display:"Readex Pro","IBM Plex Sans Arabic",Tahoma,sans-serif;
  --body:"IBM Plex Sans Arabic",Tahoma,"Segoe UI",sans-serif;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0e1514; --surface:#151f1d; --sunk:#1c2826; --line:#2a3936;
  --fg:#e3ecea; --muted:#93a7a2;
  --accent:#3fb8a2; --accent-ink:#06201b; --accent-soft:#173a34;
  --ok:#4cc27e; --warn:#e0a84a; --bad:#ef7b74; --info:#6aa6e6;
  --ok-soft:#173326; --warn-soft:#3a2e15; --bad-soft:#3d1d1b; --info-soft:#18293d;
  color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0e1514; --surface:#151f1d; --sunk:#1c2826; --line:#2a3936;
  --fg:#e3ecea; --muted:#93a7a2;
  --accent:#3fb8a2; --accent-ink:#06201b; --accent-soft:#173a34;
  --ok:#4cc27e; --warn:#e0a84a; --bad:#ef7b74; --info:#6aa6e6;
  --ok-soft:#173326; --warn-soft:#3a2e15; --bad-soft:#3d1d1b; --info-soft:#18293d;
  color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:15px;line-height:1.6;direction:rtl}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.3}
h1{font-size:1.6rem} h2{font-size:1.15rem} h3{font-size:1rem}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.shell{display:grid;grid-template-columns:240px 1fr;min-height:100%}
.rail{background:var(--surface);border-inline-start:0;border-inline-end:1px solid var(--line);padding:20px 14px;display:flex;flex-direction:column;gap:4px;position:sticky;top:0;height:100vh}
.brand{display:flex;align-items:center;gap:10px;padding:4px 8px 20px}
.brand svg{flex:none}
.brand b{font-family:var(--display);font-size:1.25rem;display:block;line-height:1.1}
.brand small{color:var(--muted);font-size:.75rem}
.nav{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:8px;color:var(--muted);text-decoration:none;font-weight:500;border:0;background:none;cursor:pointer;width:100%;text-align:start}
.nav:hover{background:var(--sunk);color:var(--fg)}
.nav[aria-current="page"]{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav svg{width:20px;height:20px;flex:none}
.rail .spacer{flex:1}
.doc{display:flex;gap:10px;align-items:center;padding:12px;border-top:1px solid var(--line)}
.avatar{width:36px;height:36px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;flex:none;font-size:.85rem}

main{min-width:0;padding-block:24px 96px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:1120px;margin:0 auto;display:flex;flex-direction:column;gap:20px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.head p{margin:2px 0 0;color:var(--muted)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:8px;cursor:pointer;font-weight:600;font-size:.9rem;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.primary:hover{filter:brightness(1.08)}
.btn.sm{padding:4px 10px;font-size:.8rem}
.btn.ghost{background:none;border-color:transparent;color:var(--muted)}
.btn.danger{color:var(--bad)}

.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);min-width:0}
.panel>header{display:flex;justify-content:space-between;align-items:center;padding:14px 18px;border-bottom:1px solid var(--line);gap:8px}
.panel .body{padding:16px 18px}
.grid2{display:grid;grid-template-columns:1.5fr 1fr;gap:20px}
.grid2>*{min-width:0}

.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px}
.stat span{color:var(--muted);font-size:.8rem;letter-spacing:.02em}
.stat b{display:block;font-family:var(--display);font-size:1.7rem;line-height:1.2;margin-top:4px}
.stat small{color:var(--muted);font-size:.78rem}

.pill{display:inline-block;padding:2px 10px;border-radius:999px;font-size:.75rem;font-weight:600;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)}
.p-warn{background:var(--warn-soft);color:var(--warn)}
.p-bad{background:var(--bad-soft);color:var(--bad)}
.p-info{background:var(--info-soft);color:var(--info)}
.p-mute{background:var(--sunk);color:var(--muted)}

.list{list-style:none;margin:0;padding:0}
.list li{display:flex;align-items:center;gap:12px;padding:12px 18px;border-bottom:1px solid var(--line)}
.list li:last-child{border-bottom:0}
.list .time{font-family:var(--display);font-weight:600;width:52px;flex:none;color:var(--accent)}
.list .who{flex:1;min-width:0}
.list .who b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.list .who small{color:var(--muted)}
.empty{padding:28px 18px;text-align:center;color:var(--muted)}

.tablewrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:.9rem}
th{text-align:start;font-weight:600;color:var(--muted);font-size:.78rem;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
td{padding:11px 14px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
tbody tr.click{cursor:pointer}
tbody tr.click:hover{background:var(--sunk)}

.toolbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.search{flex:1;min-width:200px;padding:9px 12px;border:1px solid var(--line);background:var(--surface);border-radius:8px}
.seg{display:inline-flex;background:var(--sunk);border-radius:8px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:none;padding:5px 12px;border-radius:6px;cursor:pointer;color:var(--muted);font-weight:500;font-size:.85rem}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--fg);box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* patient file */
.pfile{display:grid;grid-template-columns:300px 1fr;gap:20px;align-items:start}
.pfile>*{min-width:0}
.kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:.9rem}
.kv dt{color:var(--muted)} .kv dd{margin:0;font-weight:500}
.vitals{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.vital{background:var(--sunk);border-radius:8px;padding:10px 12px}
.vital span{font-size:.75rem;color:var(--muted)}
.vital b{display:block;font-family:var(--display);font-size:1.15rem}
.vital small{color:var(--muted);font-size:.72rem}
.timeline{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:14px}
.timeline li{border-inline-start:2px solid var(--line);padding-inline-start:14px;position:relative}
.timeline li::before{content:"";position:absolute;inset-inline-start:-6px;top:6px;width:10px;height:10px;border-radius:50%;background:var(--accent)}
.timeline small{color:var(--muted)}
.tag{display:inline-block;background:var(--bad-soft);color:var(--bad);border-radius:6px;padding:1px 8px;font-size:.78rem;margin:2px 0 2px 4px}
.tag.c{background:var(--warn-soft);color:var(--warn)}

/* rx */
.rx{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:24px;position:relative}
.rx .rxsym{font-family:Georgia,serif;font-size:2.4rem;color:var(--accent);line-height:1;font-style:italic}
.rx table td{padding:8px 10px}
.rxhead{display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap;border-bottom:2px solid var(--accent);padding-bottom:12px;margin-bottom:12px}
.rxhead small{color:var(--muted);display:block}

/* chart */
.bars{display:flex;align-items:flex-end;gap:10px;height:150px;padding-top:10px}
.bars .col{flex:1;display:flex;flex-direction:column;align-items:center;gap:6px;height:100%;justify-content:flex-end;min-width:0}
.bars .bar{width:100%;max-width:38px;background:var(--accent-soft);border-radius:5px 5px 2px 2px;position:relative}
.bars .col.today .bar{background:var(--accent)}
.bars .col span{font-size:.72rem;color:var(--muted)}
.bars .col em{font-style:normal;font-size:.75rem;font-weight:600}

/* forms / modal */
.modal{position:fixed;inset:0;background:rgba(10,20,18,.45);display:grid;place-items:center;padding:16px;z-index:50}
.sheet{background:var(--surface);border-radius:14px;width:min(560px,100%);max-height:90vh;overflow:auto;border:1px solid var(--line)}
.sheet header{display:flex;justify-content:space-between;align-items:center;padding:16px 20px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--surface)}
.sheet form{padding:18px 20px;display:grid;grid-template-columns:1fr 1fr;gap:12px}
.sheet form .full{grid-column:1/-1}
.sheet .actions{grid-column:1/-1;display:flex;gap:8px;justify-content:flex-start;padding-top:6px}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:var(--muted);font-weight:500}
label.f input,label.f select,label.f textarea{padding:9px 11px;border:1px solid var(--line);background:var(--bg);border-radius:8px;color:var(--fg);font-size:.95rem}
label.f textarea{min-height:70px;resize:vertical}
.drugrow{grid-column:1/-1;display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:6px;align-items:end}
.drugrow input{padding:8px 9px;border:1px solid var(--line);background:var(--bg);border-radius:8px;min-width:0;width:100%}

.toast{position:fixed;bottom:calc(84px + env(safe-area-inset-bottom,0px));left:50%;transform:translateX(-50%);background:var(--fg);color:var(--bg);padding:10px 18px;border-radius:8px;font-weight:500;z-index:60}
.note{font-size:.8rem;color:var(--muted)}
.example{font-size:.75rem;background:var(--info-soft);color:var(--info);padding:6px 12px;border-radius:8px}


/* calculators */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips button{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;cursor:pointer;font-size:.85rem;color:var(--muted)}
.chips button span{opacity:.7;margin-inline-start:2px}
.chips button[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.clayout{display:grid;grid-template-columns:320px 1fr;gap:20px;align-items:start}
.clayout>*{min-width:0}
.cside{max-height:calc(100vh - 120px);overflow:auto;position:sticky;top:16px}
.clist li{padding:0;gap:8px;padding-inline-end:12px}
.clist li a{flex:1;min-width:0;padding:11px 16px;text-decoration:none;color:inherit;display:block}
.clist li a b{display:block}
.clist li a small{color:var(--muted);display:block;font-size:.8rem;line-height:1.4}
.clist li:hover{background:var(--sunk)}
.clist li.sel{background:var(--accent-soft)}
.clist li.sel a b{color:var(--accent)}
.cgrid{display:grid;grid-template-columns:1fr 280px;gap:20px;align-items:start}
.cgrid>*{min-width:0}
.cform{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}
.cform label.f{min-width:0}
.cform select{width:100%}
.unit{font-weight:400;opacity:.8}
.chk{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:9px 12px;border:1px solid var(--line);border-radius:8px;cursor:pointer;background:var(--bg)}
.chk:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.chk input{width:18px;height:18px;accent-color:var(--accent);flex:none}
.chk span{flex:1}
.chk em{font-style:normal;color:var(--muted);font-size:.8rem}
#cout{position:sticky;top:16px}
.cres{border-radius:10px;padding:16px;background:var(--sunk);display:flex;flex-direction:column;gap:10px;border-top:4px solid var(--muted)}
.cres.lv-ok{border-top-color:var(--ok)} .cres.lv-warn{border-top-color:var(--warn)} .cres.lv-bad{border-top-color:var(--bad)} .cres.lv-info{border-top-color:var(--info)}
.cnum{display:flex;align-items:baseline;gap:6px;flex-wrap:wrap}
.cnum b{font-family:var(--display);font-size:2.4rem;line-height:1}
.cnum small{color:var(--muted)}
.cres .pill{align-self:flex-start;white-space:normal}
.crow{font-size:.85rem;border-top:1px solid var(--line);padding-top:8px}
.cnote{margin:0;font-size:.82rem;color:var(--muted)}
.empty-r span{color:var(--muted);font-size:.85rem}
.cref{padding:10px 18px;border-top:1px solid var(--line);font-size:.78rem;color:var(--muted)}
.back-sm{display:none}
@media (max-width:1100px){.cgrid{grid-template-columns:1fr} #cout{position:sticky;top:0;z-index:5;order:-1;padding-bottom:8px;background:var(--surface)} #cout{max-height:38vh;overflow:auto} #cout .cres{padding:10px 14px;flex-direction:row;flex-wrap:wrap;align-items:center} #cout .cnum b{font-size:1.8rem}}
@media (max-width:900px){.clayout{grid-template-columns:1fr}.cside{position:static;max-height:none}.clayout.has-sel .cside{display:none}.back-sm{display:inline}.clayout:not(.has-sel) .cintro{display:none}}
.tabbar{display:none}
@media (max-width:900px){
  .stats{grid-template-columns:repeat(2,1fr)}
  .grid2,.pfile{grid-template-columns:1fr}
}
@media (max-width:760px){
  .shell{grid-template-columns:1fr}
  .rail{display:none}
  .tabbar{display:flex;position:fixed;bottom:0;left:0;right:0;background:var(--surface);border-top:1px solid var(--line);z-index:40;
    padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px));justify-content:space-around}
  .tabbar .nav{flex-direction:column;gap:2px;font-size:.68rem;padding:6px 4px;width:auto;flex:1;align-items:center}
  main{padding-block:16px 100px}
  h1{font-size:1.35rem}
  .vitals{grid-template-columns:repeat(2,1fr)}
  .sheet form{grid-template-columns:1fr}
  .drugrow{grid-template-columns:1fr 1fr}
  .drugrow input:first-child{grid-column:1/-1}
  .hide-sm{display:none}
}
@media (prefers-reduced-motion:no-preference){.nav,.btn{transition:background .15s,border-color .15s}}
</style>

</head>
<body>
<div class="shell">
  <aside class="rail" aria-label="القائمة الرئيسية">
    <div class="brand">
      <svg width="36" height="36" viewBox="0 0 36 36" aria-hidden="true"><rect width="36" height="36" rx="9" fill="var(--accent)"/><path d="M15 9h6v6h6v6h-6v6h-6v-6H9v-6h6z" fill="var(--accent-ink)"/></svg>
      <div><b>شفاء</b><small>منصة إدارة العيادة</small></div>
    </div>
    <nav id="railnav" style="display:flex;flex-direction:column;gap:2px"></nav>
    <div class="spacer"></div>
    <div class="doc"><div class="avatar" id="docAv">د</div><div style="min-width:0"><b id="docName" style="display:block;font-size:.9rem"></b><small class="note" id="docSpec"></small></div></div>
  </aside>
  <main><div class="wrap" id="view"></div></main>
</div>
<nav class="tabbar" id="tabbar" aria-label="التنقل"></nav>
<div id="modalRoot"></div>
<div class="toast" id="toast" hidden></div>

<script>
(function(){
const ICONS={
 dashboard:'<path d="M3 13h8V3H3zm10 8h8V11h-8zM3 21h8v-6H3zm10-18v6h8V3z"/>',
 patients:'<path d="M16 11a4 4 0 1 0-4-4 4 4 0 0 0 4 4zm-8 0a3 3 0 1 0-3-3 3 3 0 0 0 3 3zm0 2c-2.3 0-7 1.2-7 3.5V19h7v-2.5c0-.9.4-1.9 1.3-2.7A10 10 0 0 0 8 13zm8 0c-2.7 0-8 1.3-8 4v2h16v-2c0-2.7-5.3-4-8-4z"/>',
 appointments:'<path d="M19 4h-1V2h-2v2H8V2H6v2H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 16H5V9h14zM7 11h5v5H7z"/>',
 rx:'<path d="M4 3h7a4 4 0 0 1 1 7.9l3 3.6 2.6-3.1 1.5 1.3-2.8 3.3 3.1 3.7-1.5 1.3-3-3.5-3 3.5-1.5-1.3 3.1-3.7L9.8 11H6v8H4zm2 2v4h5a2 2 0 0 0 0-4z"/>',
 billing:'<path d="M20 4H4a2 2 0 0 0-2 2v12a2 2 0 0 0 2 2h16a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2zm0 14H4v-6h16zm0-10H4V6h16z"/>',
 calc:'<path d="M7 2h10a2 2 0 0 1 2 2v16a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2zm0 2v4h10V4zm1 7v2h2v-2zm4 0v2h2v-2zm4 0v6h2v-6zm-8 4v2h2v-2zm4 0v2h2v-2z"/>',
 settings:'<path d="M19.4 13a7.5 7.5 0 0 0 0-2l2.1-1.6-2-3.5-2.5 1a7 7 0 0 0-1.7-1L15 3h-4l-.4 2.7a7 7 0 0 0-1.7 1l-2.5-1-2 3.5L6.6 11a7.5 7.5 0 0 0 0 2l-2.2 1.6 2 3.5 2.5-1a7 7 0 0 0 1.7 1L11 21h4l.4-2.7a7 7 0 0 0 1.7-1l2.5 1 2-3.5zM13 15.5A3.5 3.5 0 1 1 16.5 12 3.5 3.5 0 0 1 13 15.5z"/>'
};
const NAV=[['dashboard','الرئيسية'],['patients','المرضى'],['appointments','المواعيد'],['rx','الوصفات'],['calc','الحاسبات'],['billing','الفواتير'],['settings','الإعدادات']];
const icon=k=>`<svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">${ICONS[k]}</svg>`;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=()=>Math.random().toString(36).slice(2,9);
const pad=n=>String(n).padStart(2,'0');
const iso=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const addDays=(n)=>{const d=new Date();d.setDate(d.getDate()+n);return iso(d)};
const TODAY=iso(new Date());
const fmtDate=s=>{try{return new Date(s+'T00:00').toLocaleDateString('ar-EG',{weekday:'short',day:'numeric',month:'short'})}catch(e){return s}};
const fmtLong=s=>{try{return new Date(s+'T00:00').toLocaleDateString('ar-EG',{day:'numeric',month:'long',year:'numeric'})}catch(e){return s}};
const money=n=>Number(n||0).toLocaleString('ar-EG')+' '+(S.settings.currency||'ج.م');
const ageOf=b=>{if(!b)return'';const d=new Date(b),n=new Date();let a=n.getFullYear()-d.getFullYear();if(n<new Date(n.getFullYear(),d.getMonth(),d.getDate()))a--;return a};

/* ---------- storage ---------- */
const KEY='shifa-clinic-v1';
function seed(){
  const P=[
    {id:'p1',name:'أحمد محمود السيد',gender:'ذكر',birth:'1968-04-12',phone:'01001234567',blood:'A+',allergies:['البنسلين'],chronic:['سكري نوع 2','ضغط مرتفع'],notes:'يتابع كل شهر لضبط السكر.',

function vAppointments(){

{id:'mrs',cat:'neuro',name:'Modified Rankin',ar:'النتيجة الوظيفية بعد السكتة',inputs:[SL('m','الحالة الوظيفية',[['0 — لا أعراض',0],['1 — أعراض دون إعاقة مهمة',1],['2 — إعاقة خفيفة، يعتني بنفسه دون مساعدة',2],['3 — إعاقة متوسطة، يمشي دون مساعدة ويحتاج بعض العون',3],['4 — إعاقة متوسطة إلى شديدة، لا يمشي دون مساعدة',4],['5 — إعاقة شديدة، طريح الفراش ويحتاج رعاية مستمرة',5],['6 — وفاة',6]])],
 calc(v){const t=['استقلال كامل','استقلال كامل','استقلال مع قيود بسيطة','يحتاج مساعدة جزئية — تأهيل خارجي','يحتاج تأهيلاً مكثفاً','يحتاج رعاية تمريضية مستمرة','—'];return{v:v.m,max:6,lvl:v.m<=2?'ok':v.m<=4?'warn':'bad',label:v.m<=2?'نتيجة وظيفية جيدة':'نتيجة وظيفية سيئة',note:t[v.m]}},ref:'van Swieten JC et al. Stroke 1988'},
{id:'gcs',cat:'neuro',name:'Glasgow Coma Scale',ar:'مقياس غلاسكو للغيبوبة',inputs:[SL('e','فتح العينين',[['تلقائي',4],['للصوت',3],['للألم',2],['لا يفتح',1]]),SL('vb','الاستجابة اللفظية',[['متوجه',5],['مشوش',4],['كلمات غير مناسبة',3],['أصوات غير مفهومة',2],['لا استجابة',1]]),SL('m','الاستجابة الحركية',[['ينفذ الأوامر',6],['يحدد مكان الألم',5],['ينسحب من الألم',4],['انثناء غير طبيعي',3],['بسط غير طبيعي',2],['لا استجابة',1]])],
 bands:[[8,'إصابة شديدة','bad','GCS ≤ 8: فكّر في حماية مجرى الهواء.'],[12,'إصابة متوسطة','warn'],[15,'إصابة خفيفة','ok']],max:15,ref:'Teasdale G, Jennett B. Lancet 1974'},
/* ---------- Nephrology ---------- */
{id:'ckdepi',cat:'neph',name:'eGFR CKD-EPI 2021',ar:'معدل الترشيح الكبيبي التقديري',inputs:[N('cr','الكرياتينين','mg/dL','1.0'),N('age','العمر','سنة','50'),SL('sex','الجنس',[['ذكر',0],['أنثى',1]])],
 calc(v){if(!(v.cr>0&&v.age>0))return null;const f=v.sex,k=f?0.7:0.9,a=f?-0.241:-0.302;const g=142*Math.pow(Math.min(v.cr/k,1),a)*Math.pow(Math.max(v.cr/k,1),-1.2)*Math.pow(0.9938,v.age)*(f?1.012:1);
  const st=band(-g,[[-90,'G1 — طبيعي أو مرتفع','ok'],[-60,'G2 — انخفاض بسيط','ok'],[-45,'G3a — انخفاض بسيط إلى متوسط','warn'],[-30,'G3b — انخفاض متوسط إلى شديد','warn'],[-15,'G4 — انخفاض شديد','bad'],[0,'G5 — فشل كلوي','bad']]);
  return{v:Math.round(g),unit:'mL/min/1.73m²',lvl:st[2],label:st[1],note:'المرحلة تحتاج قياسين يفصل بينهما 3 أشهر على الأقل لتشخيص المرض المزمن.'}},ref:'Inker LA et al. NEJM 2021'},
{id:'cg',cat:'neph',name:'Cockcroft-Gault',ar:'تصفية الكرياتينين لضبط جرعات الأدوية',inputs:[N('age','العمر','سنة'),N('wt','الوزن','كجم'),N('cr','الكرياتينين','mg/dL'),SL('sex','الجنس',[['ذكر',0],['أنثى',1]])],
 calc(v){if(!(v.age>0&&v.wt>0&&v.cr>0))return null;const c=(140-v.age)*v.wt/(72*v.cr)*(v.sex?0.85:1);return{v:Math.round(c),unit:'mL/min',lvl:c<30?'bad':c<60?'warn':'ok',label:c<30?'تصفية منخفضة جداً — راجع الجرعات':c<60?'تصفية منخفضة':'تصفية مقبولة',note:'استخدم الوزن الفعلي؛ في السمنة فكّر في الوزن المعدل.'}},ref:'Cockcroft DW, Gault MH. Nephron 1976'},
{id:'cna',cat:'neph',name:'Corrected Na⁺',ar:'تصحيح الصوديوم لفرط السكر',inputs:[N('na','الصوديوم المقاس','mEq/L','130'),N('glu','الجلوكوز','mg/dL','400')],
 calc(v){if(!(v.na>0&&v.glu>0))return null;const k=v.na+0.016*(v.glu-100),h=v.na+0.024*(v.glu-100);return{v:r1(k),unit:'mEq/L (Katz)',lvl:k<135?'warn':k>145?'warn':'ok',label:k<135?'نقص صوديوم حقيقي':k>145?'فرط صوديوم':'صوديوم طبيعي بعد التصحيح',rows:[['Katz (1.6 لكل 100)',r1(k)],['Hillier (2.4 لكل 100)',r1(h)]]}},ref:'Katz MA 1973; Hillier TA 1999'},
{id:'cca',cat:'neph',name:'Corrected Ca²⁺',ar:'تصحيح الكالسيوم للألبومين',inputs:[N('ca','الكالسيوم الكلي','mg/dL','8.0'),N('alb','الألبومين','g/dL','2.5')],
 calc(v){if(!(v.ca>0&&v.alb>0))return null;const c=v.ca+0.8*(4-v.alb);return{v:r1(c),unit:'mg/dL',lvl:c<8.5||c>10.5?'warn':'ok',label:c<8.5?'نقص كالسيوم':c>10.5?'فرط كالسيوم':'طبيعي',note:'المعادلة تقريبية؛ عند الشك أو في الحالات الحرجة قِس الكالسيوم المتأين.'}},ref:'Payne RB et al. BMJ 1973'},
{id:'ag',cat:'neph',name:'Anion Gap + Delta Ratio',ar:'فجوة الأنيون ونسبة دلتا',inputs:[N('na','الصوديوم','mEq/L','140'),N('cl','الكلوريد','mEq/L','100'),N('hco3','البيكربونات','mEq/L','14'),N('alb','الألبومين (اختياري)','g/dL','4.0')],
 calc(v){if(!(v.na>0&&v.cl>0&&v.hco3>0))return null;const ag=v.na-v.cl-v.hco3,ca=v.alb>0?ag+2.5*(4-v.alb):ag;const rows=[['فجوة الأنيون',r1(ag)],['مصححة للألبومين',v.alb>0?r1(ca):'—']];let note='';
  if(ca>12&&v.hco3<24){const dr=(ca-12)/(24-v.hco3);rows.push(['نسبة دلتا',r2(dr)]);note=dr<0.4?'حماض بفجوة طبيعية (فرط كلوريد) غالباً':dr<0.8?'حماض مختلط: بفجوة مرتفعة + بفجوة طبيعية':dr<=2?'حماض بفجوة أنيون مرتفعة صافٍ':'حماض بفجوة مرتفعة + قلاء استقلابي (أو حماض تنفسي مزمن معاوَض)'}
  return{v:r1(ca),unit:'mEq/L',lvl:ca>12?'bad':'ok',label:ca>12?'فجوة أنيون مرتفعة':'فجوة أنيون طبيعية (8–12)',rows,note}},ref:'Wrenn K. Ann Emerg Med 1990'},

{id:'curb65',cat:'pulm',name:'CURB-65',ar:'شدة الالتهاب الرئوي المكتسب',inputs:[CK('c','تشوش ذهني جديد'),CK('u','يوريا > 7 mmol/L (BUN > 19 mg/dL)'),CK('r','معدل التنفس ≥ 30'),CK('b','انقباضي < 90 أو انبساطي ≤ 60'),CK('a','العمر ≥ 65')],
 bands:[[1,'خطر منخفض','ok','وفيات 30 يوماً ≈ 1.5%. علاج منزلي غالباً.'],[2,'خطر متوسط','warn','وفيات ≈ 9%. فكّر في الدخول أو المتابعة القريبة.'],[5,'التهاب رئوي شديد','bad','وفيات ≈ 22%. أدخِل المستشفى وقيّم الحاجة للعناية المركزة عند 4–5.']],max:5,ref:'Lim WS et al. Thorax 2003'},
{id:'wellspe',cat:'pulm',name:'Wells (PE)',ar:'الاحتمال السريري للانصمام الرئوي',inputs:[CK('dvt','علامات جلطة أوردة عميقة',3),CK('alt','الانصمام هو التشخيص الأرجح',3),CK('hr','النبض > 100',1.5),CK('imm','تثبيت ≥ 3 أيام أو جراحة خلال 4 أسابيع',1.5),CK('prev','جلطة أو انصمام سابق',1.5),CK('hemo','نفث دم',1),CK('ca','ورم نشط',1)],

{id:'bode',cat:'pulm',name:'BODE Index',ar:'توقع البقاء في COPD',inputs:[N('bmi','مؤشر كتلة الجسم','kg/m²'),N('fev','FEV1','% من المتوقع'),SL('mmrc','ضيق التنفس (mMRC)',[['0 — مع الجهد الشديد فقط',0],['1 — مع الإسراع أو صعود منحدر',0],['2 — يمشي أبطأ من أقرانه',1],['3 — يتوقف بعد 100 متر',2],['4 — لا يغادر المنزل',3]]),N('mwd','مسافة المشي 6 دقائق','متر')],
 calc(v){if(!(v.bmi>0&&v.fev>0&&v.mwd>=0&&v.mwd!==null))return null;const b=v.bmi>21?0:1,o=v.fev>=65?0:v.fev>=50?1:v.fev>=36?2:3,e=v.mwd>=350?0:v.mwd>=250?1:v.mwd>=150?2:3,s=b+o+v.mmrc+e;
  const q=band(s,[[2,'البقاء 4 سنوات ≈ 80%','ok'],[4,'البقاء 4 سنوات ≈ 67%','warn'],[6,'البقاء 4 سنوات ≈ 57%','warn'],[10,'البقاء 4 سنوات ≈ 18%','bad']]);
  return{v:s,max:10,lvl:q[2],label:q[1],rows:[['B — BMI',b],['O — FEV1',o],['D — mMRC',v.mmrc],['E — المشي',e]]}},ref:'Celli BR et al. NEJM 2004'},
{id:'aagrad',cat:'pulm',name:'A-a Gradient',ar:'تدرج الأكسجين السنخي الشرياني',inputs:[N('fio2','FiO2','%','21'),N('pao2','PaO2','mmHg','70'),N('paco2','PaCO2','mmHg','40'),N('age','العمر','سنة','50'),N('patm','الضغط الجوي','mmHg','760')],
 calc(v){if(!(v.fio2>0&&v.pao2>0&&v.paco2>0))return null;const f=v.fio2>1?v.fio2/100:v.fio2,pa=f*((v.patm>0?v.patm:760)-47)-v.paco2/0.8,g=pa-v.pao2,exp=v.age>0?v.age/4+4:null;const hi=exp!=null&&g>exp;
  return{v:r1(g),unit:'mmHg',lvl:hi?'warn':'ok',label:hi?'تدرج مرتفع: خلل تهوية/تروية، تحويلة، أو خلل انتشار':'تدرج طبيعي: فكّر في نقص التهوية أو انخفاض الأكسجين المستنشق',rows:[['PAO2 السنخي',r1(pa)],['الحد المتوقع للعمر',exp!=null?r1(exp):'—'],['P/F',Math.round(v.pao2/f)]]}},ref:'West JB, Respiratory Physiology'},
{id:'stopbang',cat:'pulm',name:'STOP-BANG',ar:'فحص انقطاع النفس الانسدادي أثناء النوم',inputs:[CK('s','شخير عالٍ'),CK('t','تعب أو نعاس نهاري'),CK('o','ملاحظة توقف التنفس أثناء النوم'),CK('p','ارتفاع ضغط الدم'),CK('b','BMI > 35'),CK('a','العمر > 50'),CK('n','محيط الرقبة > 40 سم'),CK('g','ذكر')],
 bands:[[2,'خطر منخفض','ok'],[4,'خطر متوسط','warn','فكّر في دراسة نوم إذا وُجدت أعراض.'],[8,'خطر مرتفع','bad','يوصى بدراسة النوم (Polysomnography).']],max:8,ref:'Chung F et al. Anesthesiology 2008'},

{id:'childpugh',cat:'gi',name:'Child-Pugh',ar:'شدة تليف الكبد',inputs:[SL('bili','البيليروبين',[['< 2 mg/dL',1],['2–3 mg/dL',2],['> 3 mg/dL',3]]),SL('alb','الألبومين',[['> 3.5 g/dL',1],['2.8–3.5 g/dL',2],['< 2.8 g/dL',3]]),SL('inr','INR',[['< 1.7',1],['1.7–2.3',2],['> 2.3',3]]),SL('asc','الاستسقاء',[['لا يوجد',1],['خفيف',2],['متوسط إلى شديد',3]]),SL('enc','الاعتلال الدماغي',[['لا يوجد',1],['درجة 1–2',2],['درجة 3–4',3]])],
 bands:[[6,'الفئة A','ok','بقاء سنة ≈ 100%، سنتين ≈ 85%.'],[9,'الفئة B','warn','بقاء سنة ≈ 80%، سنتين ≈ 60%.'],[15,'الفئة C','bad','بقاء سنة ≈ 45%، سنتين ≈ 35%.']],max:15,ref:'Pugh RN et al. Br J Surg 1973'},
{id:'meldna',cat:'gi',name:'MELD-Na',ar:'شدة مرض الكبد في المرحلة الأخيرة',inputs:[N('bili','البيليروبين','mg/dL'),N('inr','INR',''),N('cr','الكرياتينين','mg/dL'),N('na','الصوديوم','mEq/L'),YN('dial','غسيل كلوي مرتين خلال الأسبوع الماضي')],
 calc(v){if(!(v.bili>0&&v.inr>0&&v.cr>0&&v.na>0))return null;const cr=v.dial?4:Math.min(Math.max(v.cr,1),4),b=Math.max(v.bili,1),i=Math.max(v.inr,1);let m=10*(0.957*Math.log(cr)+0.378*Math.log(b)+1.12*Math.log(i)+0.643);m=Math.round(m*10)/10;const na=Math.min(Math.max(v.na,125),137);let mn=m>11?m+1.32*(137-na)-0.033*m*(137-na):m;mn=Math.min(40,Math.round(mn));
  const q=band(mn,[[9,'وفيات 3 أشهر ≈ 1.9%','ok'],[19,'وفيات 3 أشهر ≈ 6%','warn'],[29,'وفيات 3 أشهر ≈ 19.6%','bad'],[39,'وفيات 3 أشهر ≈ 52.6%','bad'],[40,'وفيات 3 أشهر ≈ 71.3%','bad']]);return{v:mn,max:40,lvl:q[2],label:q[1],rows:[['MELD الأساسي',Math.round(m)]]}},ref:'Kim WR et al. NEJM 2008'},
{id:'ranson',cat:'gi',name:'Ranson',ar:'شدة التهاب البنكرياس الحاد (غير المراري)',inputs:[CK('a','عند الدخول: العمر > 55'),CK('w','عند الدخول: كريات بيضاء > 16,000'),CK('g','عند الدخول: جلوكوز > 200 mg/dL'),CK('l','عند الدخول: LDH > 350 IU/L'),CK('s','عند الدخول: AST > 250 IU/L'),CK('h','خلال 48 ساعة: انخفاض الهيماتوكريت > 10%'),CK('b','خلال 48 ساعة: ارتفاع BUN > 5 mg/dL'),CK('c','خلال 48 ساعة: كالسيوم < 8 mg/dL'),CK('o','خلال 48 ساعة: PaO2 < 60 mmHg'),CK('d','خلال 48 ساعة: عجز القاعدة > 4 mEq/L'),CK('f','خلال 48 ساعة: احتباس سوائل > 6 لتر')],
 bands:[[2,'التهاب خفيف','ok','وفيات ≈ 0–3%.'],[4,'التهاب شديد','warn','وفيات ≈ 15%.'],[6,'التهاب شديد','bad','وفيات ≈ 40%.'],[11,'التهاب شديد جداً','bad','وفيات قريبة من 100% في السلسلة الأصلية.']],max:11,note:'لا يكتمل التقييم قبل مرور 48 ساعة. لالتهاب البنكرياس المراري تُستخدم حدود مختلفة.',ref:'Ranson JH et al. Surg Gynecol Obstet 1974'},
{id:'rockall',cat:'gi',name:'Rockall (كامل)',ar:'خطر النزف العلوي بعد المنظار',inputs:[SL('age','العمر',[['< 60',0],['60–79',1],['≥ 80',2]]),SL('shock','الصدمة',[['لا صدمة (نبض < 100، انقباضي ≥ 100)',0],['تسارع قلب (نبض ≥ 100)',1],['هبوط ضغط (انقباضي < 100)',2]]),SL('com','الأمراض المصاحبة',[['لا يوجد',0],['قصور قلب، قصور تاجي، أو مرض رئيسي آخر',2],['فشل كلوي، فشل كبدي، أو ورم منتشر',3]]),SL('dx','التشخيص بالمنظار',[['تمزق مالوري-فايس أو لا آفة',0],['كل التشخيصات الأخرى',1],['ورم في الجهاز الهضمي العلوي',2]]),SL('srh','علامات النزف الحديث',[['لا يوجد أو بقعة داكنة فقط',0],['دم، جلطة ملتصقة، وعاء ظاهر أو نزف نشط',2]])],
 calc(v,s){const t=[[4.9,0],[3.4,0],[5.3,0.2],[11.2,2.9],[14.1,5.3],[24.1,10.8],[32.9,17.3],[43.8,27],[41.8,41.1]][Math.min(s,8)];return{v:s,max:11,lvl:s<=2?'ok':s<=4?'warn':'bad',label:s<=2?'خطر منخفض — قد يصلح للخروج المبكر':s<=4?'خطر متوسط':'خطر مرتفع',rows:[['خطر إعادة النزف',t[0]+'%'],['خطر الوفاة',t[1]+'%']]}},ref:'Rockall TA et al. Gut 1996'},

{id:'ddimer',cat:'hem',name:'D-dimer (حد معدّل للعمر)',ar:'تفسير D-dimer مع الاحتمال السريري',inputs:[N('age','العمر','سنة'),N('dd','D-dimer','ng/mL FEU'),SL('pre','الاحتمال السريري (Wells)',[['غير مرجح (Wells ≤ 4)',0],['مرجح (Wells > 4)',1]])],

  return{v:Math.round(cut),unit:'ng/mL — الحد المعدّل',lvl:neg?'ok':'warn',label:neg?'سلبي: يُستبعد الانصمام عملياً':'إيجابي: يلزم التصوير',rows:[['القيمة المقاسة',v.dd],['الحد التقليدي','500']]}},ref:'Righini M et al. JAMA 2014 (ADJUST-PE)'},
{id:'iss',cat:'hem',name:'ISS — الورم النقوي المتعدد',ar:'نظام التدريج الدولي',inputs:[N('b2m','بيتا-2 ميكروغلوبولين','mg/L'),N('alb','الألبومين','g/dL')],
 calc(v){if(!(v.b2m>0&&v.alb>0))return null;const st=v.b2m<3.5&&v.alb>=3.5?1:v.b2m>=5.5?3:2;return{v:['','I','II','III'][st],unit:'المرحلة',lvl:['','ok','warn','bad'][st],label:'متوسط البقاء ≈ '+['',62,44,29][st]+' شهراً (السلسلة الأصلية)',note:'R-ISS يضيف LDH والتغيرات الوراثية الخلوية لتقدير أدق.'}},ref:'Greipp PR et al. JCO 2005'},

{id:'hba1c',cat:'endo',name:'HbA1c تحويل',ar:'DCCT ↔ IFCC + متوسط الجلوكوز التقديري',inputs:[N('a','HbA1c','% (DCCT)','7.0')],

let calcCat='all',calcQ='';const calcVals={};
function calcValues(c){
  const st=calcVals[c.id]||{},v={};let sum=0;
  c.inputs.forEach(i=>{const raw=st[i.id];
    if(i.t==='n'){const x=raw===undefined||raw===''?NaN:parseFloat(String(raw).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d)).replace('٫','.').replace(',','.'));v[i.id]=isFinite(x)?x:null}
    else if(i.t==='s'){const idx=raw===undefined?0:+raw;v[i.id]=i.opts[idx][1];sum+=i.opts[idx][1]}
    else{v[i.id]=!!raw;if(raw)sum+=i.pts}});
  return{v,sum};
}
function calcResult(c){
  const {v,sum}=calcValues(c);let r;
  if(c.calc)r=c.calc(v,sum);
  else{const b=band(sum,c.bands);r={v:sum,max:c.max,lvl:b[2],label:b[1],note:b[3]}}
  if(!r)return `<div class="cres empty-r"><b>—</b><span>أدخل القيم المطلوبة لعرض النتيجة.</span></div>`;
  const note=[r.note,c.note&&c.note!==r.note?c.note:''].filter(Boolean);
  return `<div class="cres lv-${r.lvl}"><div class="cnum"><b class="num">${esc(r.v)}</b>${r.max!=null?`<small class="num">/ ${r.max}</small>`:''}${r.unit?`<small>${esc(r.unit)}</small>`:''}</div>
   <span class="pill p-${r.lvl==='ok'?'ok':r.lvl==='warn'?'warn':r.lvl==='bad'?'bad':'info'}">${esc(r.label)}</span>
   ${r.rows?`<dl class="kv crow">${r.rows.map(x=>`<dt>${esc(x[0])}</dt><dd class="num">${esc(x[1])}</dd>`).join('')}</dl>`:''}
   ${note.map(n=>`<p class="cnote">${esc(n)}</p>`).join('')}</div>`;
}
function calcInputs(c){
  const st=calcVals[c.id]||{};
  return c.inputs.map(i=>{const fid=`c-${c.id}-${i.id}`;
    if(i.t==='n')return `<label class="f" for="${fid}"><span>${esc(i.label)}${i.unit?` <span class="unit">(${esc(i.unit)})</span>`:''}</span><input id="${fid}" data-ci="${i.id}" inputmode="decimal" autocomplete="off" placeholder="${esc(i.ph)}" value="${esc(st[i.id]??'')}"></label>`;
    if(i.t==='s')return `<label class="f" for="${fid}">${esc(i.label)}<select id="${fid}" data-ci="${i.id}">${i.opts.map((o,k)=>`<option value="${k}" ${String(st[i.id]??0)===String(k)?'selected':''}>${esc(o[0])}${c.calc||o[1]===0?'':` (+${o[1]})`}</option>`).join('')}</select></label>`;
    return `<label class="chk" for="${fid}"><input type="checkbox" id="${fid}" data-ci="${i.id}" ${st[i.id]?'checked':''}><span>${esc(i.label)}</span><em class="num">+${i.pts}</em></label>`;
  }).join('');
}
function vCalc(id){

  const counts={};CALCS.forEach(x=>counts[x.cat]=(counts[x.cat]||0)+1);
  const q=calcQ.trim().toLowerCase();
  const list=CALCS.filter(x=>(calcCat==='all'||x.cat===calcCat)&&(!q||(x.name+' '+x.ar+' '+CALC_CATS[x.cat]).toLowerCase().includes(q)));
  const chips=`<div class="chips" role="group" aria-label="التخصصات"><button data-cc="all" aria-pressed="${calcCat==='all'}">الكل <span class="num">${CALCS.length}</span></button>${Object.keys(CALC_CATS).filter(k=>counts[k]).map(k=>`<button data-cc="${k}" aria-pressed="${calcCat===k}">${CALC_CATS[k]} <span class="num">${counts[k]}</span></button>`).join('')}</div>`;
  const listHtml=`<ul class="list clist">${list.map(x=>`<li ${c&&c.id===x.id?'class="sel"':''}><a href="#calc-${x.id}"><b dir="auto">${esc(x.name)}</b><small>${esc(x.ar)}</small></a><span class="pill p-mute">${CALC_CATS[x.cat]}</span></li>`).join('')||`<li class="empty">لا حاسبة مطابقة لـ "${esc(calcQ)}".</li>`}</ul>`;

function bindCalc(){
  const f=document.getElementById('cform');

    const upd=e=>{const el=e.target;if(!el.dataset.ci)return;const st=calcVals[c.id]=calcVals[c.id]||{};st[el.dataset.ci]=el.type==='checkbox'?el.checked:el.value;document.getElementById('cout').innerHTML=calcResult(c)};
    f.addEventListener('input',upd);f.addEventListener('change',upd);}

  $('#tabbar').innerHTML=NAV.filter(n=>!['settings','billing','rx'].includes(n[0])).concat([['settings','المزيد']]).map(([k,l])=>`<a class="nav" href="#${k}" ${base===k||(k==='settings'&&(base==='billing'||base==='rx'))?'aria-current="page"':''}>${icon(k)}<span>${l}</span></a>`).join('');

  $('#view').innerHTML=html;
  const ps=$('#pSearch');if(ps){ps.oninput=e=>{pq=e.target.value;const pos=e.target.selectionStart;render();const n=$('#pSearch');n.focus();n.setSelectionRange(pos,pos)}}
  bindCalc();
  const sf=$('#sform');if(sf)sf.onsubmit=e=>{e.preventDefault();const fd=new FormData(sf);for(const[k,v]of fd.entries())S.settings[k]=(k==='fee'||k==='follow')?+v||0:v;save();render();toast('تم حفظ الإعدادات')};
}

  if(d.pay){S.invoices.find(i=>i.id===d.pay).status='paid';save();render();toast('تم تسجيل الدفع');return}
  if(d.copyrx){const r=S.rxs.find(x=>x.id===d.copyrx),p=P(r.pid);const txt=`${S.settings.doctor} — ${S.settings.clinic}\nالمريض: ${p.name}\nالتاريخ: ${fmtLong(r.date)}\nالتشخيص: ${r.dx}\n\n`+r.items.map((i,n)=>`${n+1}. ${i.drug} — ${i.dose} — ${i.freq} — ${i.dur}`).join('\n')+(r.notes?`\n\nتعليمات: ${r.notes}`:'');
    try{navigator.clipboard.writeText(txt).then(()=>toast('تم نسخ الوصفة'),()=>toast('تعذّر النسخ، حدّد النص يدوياً'))}catch(err){toast('تعذّر النسخ، حدّد النص يدوياً')}return}
  switch(d.act){
    case'newPatient':patientForm();break;
    case'newAppt':apptForm();break;
    case'newRx':rxForm();break;
    case'newInv':invoiceForm();break;
    case'askWipe':confirmReset=true;render();break;
    case'cancelWipe':confirmReset=false;render();break;
    case'wipe':{const st=S.settings;S={sample:false,settings:st,patients:[],appts:[],rxs:[],invoices:[]};confirmReset=false;save();render();toast('تم مسح البيانات');break}
    case'reseed':S=seed();save();render();toast('تمت استعادة البيانات التوضيحية');break;
  }
});
document.addEventListener('keydown',e=>{if(e.key==='Escape')$('#modalRoot').innerHTML=''});
render();
})();
</script>
